name: mongodb-sharded

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mongodb-sharded.yml'
      - 'containers/mongodb-sharded/**'

  pull_request:
    branches: [ "main" ]
    paths:
      - 'containers/mongodb-sharded/**'

  workflow_dispatch:
    inputs:
      mongodb_version:
        description: '빌드할 MongoDB 8.0.x 버전 (fastdl 에 debian12 tarball 이 있어야 함)'
        required: false
        default: ''

env:
  # 버전은 여기 한 곳에서만 관리한다. Dockerfile 의 ARG 기본값과 이미지 태그가
  # 갈라지지 않도록 build-arg 로 함께 내려보낸다.
  MONGODB_VERSION: '8.0.30'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Resolve version
        id: ver
        run: |
          V="${{ github.event.inputs.mongodb_version }}"
          if [ -z "$V" ]; then V="${{ env.MONGODB_VERSION }}"; fi
          echo "value=$V" >> "$GITHUB_OUTPUT"
          echo "building MongoDB $V"

      - name: Verify upstream tarball exists
        run: |
          # 없는 버전으로 빌드를 시작하면 레이어를 다 쌓고 마지막에 죽는다. 먼저 확인한다.
          URL="https://fastdl.mongodb.org/linux/mongodb-linux-x86_64-debian12-${{ steps.ver.outputs.value }}.tgz"
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -I "$URL")
          echo "$URL -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::upstream tarball not published for ${{ steps.ver.outputs.value }} (HTTP $CODE)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: shepherd9664/mongodb-sharded
          tags: |
            type=raw,value=${{ steps.ver.outputs.value }}-debian-12-{{date 'YYYY.MM.DD-HHmm' tz='Asia/Seoul'}}
            type=raw,value=${{ steps.ver.outputs.value }}-debian-12-latest

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build
        uses: docker/build-push-action@v4
        with:
          context: ./containers/mongodb-sharded
          file: containers/mongodb-sharded/Dockerfile
          # 공식 debian12 tarball 이 x86_64 만 있어서 amd64 단일 플랫폼이다.
          platforms: linux/amd64
          build-args: |
            MONGODB_VERSION=${{ steps.ver.outputs.value }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
